version: '3.8'

services:
  # Contenedor 1: Aplicación Python
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: python_app_integracion
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - red_integracion
    restart: on-failure

  # Contenedor 2: Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db_integracion
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red_integracion
    restart: always

# Red propia aislada (Punto 4)
networks:
  red_integracion:
    driver: bridge

# Volumen de datos persistente (Punto 3)
volumes:
  datos_postgres:
    driver: local